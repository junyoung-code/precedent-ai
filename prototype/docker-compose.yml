services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: precedent_ai
      POSTGRES_USER: precedent_ai
      POSTGRES_PASSWORD: precedent_ai_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precedent_ai -d precedent_ai"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - precedent-ai-db:/var/lib/postgresql/data

volumes:
  precedent-ai-db:
